<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The pokiemon</title>
</head>
<style>
    #container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.pokemon-card{
    width:280px;
    padding:20px;
    border-radius:15px;
    background:#fff;
    box-shadow:0 5px 10px rgba(0,0,0,.2);
    text-align:center;
}

.pokemon-card img{
    width:180px;
    height:180px;
    object-fit:contain;
}

.pokemon-card h2{
    text-transform:capitalize;
    margin:10px 0;
}

.stats{
    text-align:left;
    margin-top:10px;
}

body
{
    background-color: aquamarine;
}
</style>
<body>
    <div>
        <input type="number" placeholder="number of cards">
        <label for="type">Select Pokémon Type:</label>

<select id="type" name="type">
  <option value="">-- Select Type --</option>
  <option value="normal">Normal</option>
  <option value="fire">Fire</option>
  <option value="water">Water</option>
  <option value="grass">Grass</option>
  <option value="electric">Electric</option>
  <option value="ice">Ice</option>
  <option value="fighting">Fighting</option>
  <option value="poison">Poison</option>
  <option value="ground">Ground</option>
  <option value="flying">Flying</option>
  <option value="psychic">Psychic</option>
  <option value="bug">Bug</option>
  <option value="rock">Rock</option>
  <option value="ghost">Ghost</option>
  <option value="dragon">Dragon</option>
  <option value="dark">Dark</option>
  <option value="steel">Steel</option>
  <option value="fairy">Fairy</option>
  
</select>
<button onclick="getCards()">Done</button>
    </div>
    <div id="container">

    </div>
    
</body>
<script>
    const typeColors = {
  normal: "#A8A77A",
  fire: "#EE8130",
  water: "#6390F0",
  electric: "#F7D02C",
  grass: "#7AC74C",
  ice: "#96D9D6",
  fighting: "#C22E28",
  poison: "#A33EA1",
  ground: "#E2BF65",
  flying: "#A98FF3",
  psychic: "#F95587",
  bug: "#A6B91A",
  rock: "#B6A136",
  ghost: "#735797",
  dragon: "#6F35FC",
  dark: "#705746",
  steel: "#B7B7CE",
  fairy: "#D685AD"
};

    let container=document.querySelector(".container")
    async function getCards()
    {
        const selectedType = document.getElementById("type").value;
        const response=await fetch('https://pokeapi.co/api/v2/type/'+selectedType)
        const data=await response.json()
        render(data)
    }

    function component(pokemon)
    {const card = `
<div class="pokemon-card">
    <img src="${pokemon.sprites.other["official-artwork"].front_default}" 
         alt="${pokemon.name}">

    <h2>${pokemon.name.toUpperCase()}</h2>

    <p><strong>#${pokemon.id}</strong></p>

    <p><strong>Type:</strong> ${pokemon.types
      .map(type => type.type.name)
      .join(", ")}</p>

    <p><strong>Height:</strong> ${pokemon.height / 10} m</p>

    <p><strong>Weight:</strong> ${pokemon.weight / 10} kg</p>

    <p><strong>Ability:</strong> ${pokemon.abilities
      .map(ability => ability.ability.name)
      .join(", ")}</p>

    <div class="stats">
        ${pokemon.stats.map(stat => `
            <p>
                ${stat.stat.name}: ${stat.base_stat}
            </p>
        `).join("")}
    </div>
</div>
`;


document.getElementById("container").innerHTML += card;}
    function state()
    {

    }
    async function render(data)
    {
        document.getElementById("container").innerHTML=""
        let num=document.querySelector("input").value
        let selectedPokemon=data.pokemon.slice(0,num)
        
        for(let i=0;i<num;i++)
    {
        const pokemonUrl = selectedPokemon[i].pokemon.url;

const response = await fetch(pokemonUrl);
const pokemonData = await response.json();
component(pokemonData)
    }

    }
</script>
</html>
